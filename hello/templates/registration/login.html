{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-4">
    <h1 class="text-center mb-4">Login</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary btn-block mt-3">Login</button>
                </form>
                <p class="mt-3 text-center">Don't have an account? <a href="{% url 'signup_role' %}">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
